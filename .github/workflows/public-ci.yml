name: Windows build candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
          rustc --version
      - run: npm ci
      - run: node scripts/verify-public-source.mjs
      - run: npm audit
      - name: Build unsigned candidate from locked dependencies
        run: npm run desktop:build -- -- --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Record installer digest
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $files = @(Get-ChildItem -LiteralPath $dir -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected one candidate installer' }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($files[0].Name)" | Set-Content -Encoding ascii (Join-Path $dir 'SHA256SUMS.txt')
      - name: Upload candidate for manual review (not a release)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ponkan-unsigned-windows-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

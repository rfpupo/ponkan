[package]
name = "ponkan"
version = "0.3.0"
description = "VALORANT settings profile manager"
authors = ["Ponkan contributors"]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
name = "ponkan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "=0.3.55", features = ["serde-well-known"] }
sha2 = "0.11"
unicode-normalization = "0.1"
walkdir = "2"
sysinfo = "0.35"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = { version = "0.18.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi"] }
